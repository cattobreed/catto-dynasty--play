<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catto Dynasty: Sunport Harbor</title>
<style>
:root{--bg:#f3eefc;--card:#fff;--tx:#231a3b;--mu:#6d6188;--pr:#7c3aed;--bd:#d8cdf1;--gold:#b7791f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150f26;--card:#211838;--tx:#f0eafc;--mu:#a99dc9;--pr:#a78bfa;--bd:#3b2e5f;--gold:#f5c451;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#150f26;--card:#211838;--tx:#f0eafc;--mu:#a99dc9;--pr:#a78bfa;--bd:#3b2e5f;--gold:#f5c451;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 Georgia,"Times New Roman",serif}
.w{max-width:480px;margin:0 auto;padding:12px}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:var(--mu);font-size:13px;margin:0 0 10px}
.pl{display:flex;gap:8px;margin-bottom:10px}
.p{flex:1;background:var(--card);border:2px solid var(--bd);border-radius:10px;padding:6px 10px}
.p.on{border-color:var(--pr)}
.p b{display:block;font-size:13px}
.p span{font-size:20px;color:var(--gold);font-weight:700}
.bd{display:grid;grid-template:repeat(6,1fr)/repeat(6,1fr);gap:3px;aspect-ratio:1}
.t{position:relative;background:var(--card);border:2px solid var(--bd);border-radius:6px;padding:8px 2px 2px;text-align:center;font:9px/1.15 system-ui,sans-serif;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.t i{position:absolute;top:0;left:0;right:0;height:5px}
.t b{font-weight:600}
.t small{color:var(--mu);font-size:8px}
.t em{font-style:normal;font-size:14px}
.tk{display:flex;justify-content:center;gap:2px;margin-top:1px}
.tk u{width:9px;height:9px;border-radius:50%;border:1px solid #fff}
.c{grid-area:2/2/6/6;background:var(--card);border:2px solid var(--pr);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px;gap:4px}
.c .d{font-size:26px}
.c .m{font-size:13px;color:var(--mu)}
.c .r{font-size:12px}
.ac{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
button{flex:1;min-height:46px;border:0;border-radius:10px;background:var(--pr);color:#fff;font:600 16px Georgia,serif;padding:0 14px}
button.s{background:var(--card);color:var(--tx);border:2px solid var(--bd)}
button:disabled{opacity:.4}
.lg{font:13px/1.5 system-ui,sans-serif;color:var(--mu);margin:0;padding-left:18px}
.lg li:first-child{color:var(--tx)}
.lm{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:2px solid var(--bd);border-radius:10px;padding:8px 12px;margin-top:8px}
.lm small{color:var(--gold);font-size:16px;letter-spacing:2px}
.lm button{flex:none;min-height:40px;font-size:14px}
#cv .p{margin-bottom:0;flex:none}
#cv>button{width:100%;margin-top:10px}
.sc{border-radius:12px;padding:10px;margin-top:10px;overflow:hidden;position:relative}
.sc.in{animation:rise .9s ease-out}
@keyframes rise{from{transform:translateY(60px) scale(.9);opacity:0}to{transform:none;opacity:1}}
.arr{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#150f26cc;color:#fff;font-size:18px;z-index:2;animation:fade 1.4s forwards;pointer-events:none}
@keyframes fade{0%,60%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.sc.in{animation:none}.arr{display:none}}
.gr{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pt{aspect-ratio:1;background:#ffffff55;border:2px dashed #fff8;border-radius:8px;position:relative;display:flex;align-items:flex-end;justify-content:center}
.pt.sel{border:2px solid var(--pr);background:#ffffffaa}
.pt small{align-self:center;font-size:22px;color:#fff}
.pt em{position:absolute;top:0;left:2px;font-style:normal;font-size:9px;color:#b7791f}
.sw{min-height:40px;border:2px solid #fff}
.die{display:inline-grid;grid-template:repeat(3,1fr)/repeat(3,1fr);width:34px;height:34px;background:#fff;border-radius:8px;padding:4px;gap:1px;margin:0 3px;box-shadow:0 2px 0 #0004,inset 0 -2px 0 #0002;vertical-align:middle}.die i{border-radius:50%;background:transparent}.die i.o{background:#1f1630}.die.r{animation:dsp .16s linear infinite}@keyframes dsp{to{transform:rotate(360deg) scale(1.08)}}.die.l{animation:dpop .35s ease-out}@keyframes dpop{0%{transform:scale(1.5) rotate(-25deg)}100%{transform:none}}
#tm,#tc,#ta{padding:0 6px;font-size:15px}
h1+.ac{gap:4px;margin:4px 0 6px}#bm,#bs{flex:0 0 auto;min-height:0;padding:4px 9px;font:600 11px system-ui,sans-serif;border-width:1px;border-radius:8px}
#tv{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font:600 20px Georgia,serif;overflow:hidden;background:radial-gradient(circle at 50% 45%,#4a2a9a,#0b0716 75%);transition:opacity .5s;animation:tvin .4s}
@keyframes tvin{from{opacity:0}to{opacity:1}}
#tv .st{position:absolute;height:2px;width:70px;background:linear-gradient(90deg,transparent,#fff);border-radius:2px;animation:wp var(--d) linear infinite}
@keyframes wp{from{transform:translateX(110vw)}to{transform:translateX(-30vw)}}
#tv .rt{position:relative;width:78%;max-width:420px;height:6px;background:#ffffff40;border-radius:3px;margin:46px 0 30px}
#tv .dt{position:absolute;top:-5px;width:16px;height:16px;border-radius:50%;background:#f5c451;box-shadow:0 0 12px #f5c451}
#tv .hero{position:absolute;top:-48px;left:0;animation:go 2.6s .2s ease-in-out forwards}
@keyframes go{from{left:0}to{left:calc(100% - 52px)}}
#tv .bob{animation:bob .5s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-8px)}}
#tv .ar{animation:fi .6s 1.6s both}#tv small{position:absolute;bottom:22px;font:12px system-ui,sans-serif;opacity:.6}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#tv .st{display:none}#tv .hero,#tv .bob{animation:none}}
.dc{position:absolute;right:0;bottom:0;width:40%;height:40%;pointer-events:none}
.cp{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0;max-height:180px;overflow-y:auto}
.cp div{background:var(--card);border:2px solid var(--bd);border-radius:10px;padding:4px 2px;text-align:center;font:11px system-ui,sans-serif}
.cp div.on{border-color:var(--pr)}
.tk u.ch{width:16px;height:16px;border:0;background:none}
.al{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.al div{aspect-ratio:1.3;display:flex;align-items:center;justify-content:center;text-align:center;background:var(--card);border:2px dashed var(--bd);border-radius:10px;font:13px system-ui,sans-serif;color:var(--mu)}
.al div.on{border:2px solid var(--pr);color:var(--tx)}
</style></head>
<body><div class="w">
<h1>Catto Dynasty</h1>
<div class="ac" style="margin-bottom:6px"><button class="s" id="bm" onclick="tgm()">🎵 Music</button><button class="s" id="bs" onclick="tgs()">🔊 Sound</button></div>
<p class="sub">Prototype: Sunport Harbor. Free play, no blockchain yet.</p>
<p class="sub" style="margin-bottom:2px">Your character</p><div class="cp" id="cp"></div>
<div class="ac"><button id="tm" onclick="tab('m')">Match</button><button id="tc" class="s" onclick="tab('c')">My City</button><button id="ta" class="s" onclick="tab('a')">Dynasty Vault</button></div>
<div id="mv"><div class="pl" id="pl"></div>
<div class="bd" id="bd"></div>
<div class="ac" id="ac"></div>
<ul class="lg" id="lg"></ul></div>
<div id="cv" hidden></div><div id="av" hidden></div>
</div>
<script>
const D={h:'#2a9d8f',m:'#e9a23b',o:'#d6577e',t:'#8b5cf6'};
const T=[{n:'Start',k:'s'},{n:'Lighthouse',k:'p',d:'h',p:60},{n:'Fish Market',k:'p',d:'h',p:60},{n:'Event',k:'e'},{n:'Dock Crane',k:'p',d:'h',p:80},{n:'Rest Stop',k:'r'},{n:'Ferry Terminal',k:'p',d:'m',p:100},{n:'Harbor Hotel',k:'p',d:'m',p:100},{n:'Tax',k:'x'},{n:'Spice Stall',k:'p',d:'m',p:120},{n:'Timeout',k:'j'},{n:'Clock Tower',k:'p',d:'o',p:140},{n:'Fountain Sq',k:'p',d:'o',p:140},{n:'Event',k:'e'},{n:'Bank House',k:'p',d:'o',p:160},{n:'Bonus Hub',k:'b'},{n:'Sky Tower',k:'p',d:'t',p:180},{n:'Grand Plaza',k:'p',d:'t',p:180},{n:'Event',k:'e'},{n:'Royal Quay',k:'p',d:'t',p:200}];
const IC={s:'🏁',e:'❓',r:'☕',x:'💸',j:'⏳',b:'🎁'};
const EV=[['Harbor festival! +120',120],['Storm damage. -80',-80],['Found a treasure chest! +100',100],['Repair bill. -60',-60]];
const pos=i=>i<=5?[5-i,0]:i<=10?[0,i-5]:i<=15?[i-10,5]:[5,5-(i-15)];
let P,own,lv,turn,round,over,L,msg,dice;
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=n=>Math.floor(Math.random()*n);
const PIPS=[[],[4],[0,8],[0,4,8],[0,2,6,8],[0,2,4,6,8],[0,2,3,5,6,8]];
function die(n,c){return `<span class="die ${c}">${[0,1,2,3,4,5,6,7,8].map(j=>`<i class="${PIPS[n].includes(j)?'o':''}"></i>`).join('')}</span>`}
function dHTML(a,b,r){const c=r?'r':'l';return die(a,c)+die(b,c)}
function init(){P=[{n:'You',c:1500,p:0,s:0,col:'#7c3aed'},{n:'Bot',c:1500,p:0,s:0,col:'#f59e0b'}];own={};lv={};turn=0;round=1;over=false;L=['Your turn. Roll the dice!'];msg='Tap Roll to begin';dice='🎲';render();ask([['Roll dice',roll]])}
function rent(i){const t=T[i];let r=Math.round(t.p*.1);if(lv[i])r=Math.round(r*1.8);const o=own[i];const g=T.map((x,j)=>x.d===t.d?j:-1).filter(j=>j>=0);if(g.every(j=>own[j]===o))r*=2;return r}
function log(m){L.unshift(m);L=L.slice(0,6);$('lg').innerHTML=L.map(x=>'<li>'+x+'</li>').join('')}
function render(){
$('pl').innerHTML=P.map((p,i)=>`<div class="p ${turn===i&&!over?'on':''}"><b>${p.n} · round ${Math.min(round,20)}/20</b><span>${p.c}</span></div>`).join('');
let h='';
T.forEach((t,i)=>{const [r,c]=pos(i);const o=own[i];const col=o!==undefined?P[o].col:'';
const st=t.k==='p'?`<small>${o!==undefined?'rent '+rent(i)+(lv[i]?' ★':''):t.p}</small>`:'';
const tk=P.map((p,pi)=>p.p===i?(pi===0?`<u class="ch">${cz(G.ch||0,16)}</u>`:`<u style="background:${p.col}"></u>`):'').join('');
h+=`<div class="t" style="grid-row:${r+1};grid-column:${c+1};${col?'border-color:'+col:''}">${t.d?`<i style="background:${D[t.d]}"></i>`:''}${IC[t.k]?`<em>${IC[t.k]}</em>`:''}<b>${t.n}</b>${st}<div class="tk">${tk}</div></div>`});
h+=`<div class="c"><div class="d">${dice}</div><div class="m">${msg}</div></div>`;
$('bd').innerHTML=h;$('lg').innerHTML=L.map(x=>'<li>'+x+'</li>').join('')}
function ask(opts){return new Promise(res=>{const a=$('ac');a.innerHTML='';opts.forEach(([t,f,s])=>{const b=document.createElement('button');b.textContent=t;if(s)b.className='s';b.onclick=()=>{a.innerHTML='';res(f&&f())};a.appendChild(b)})})}
async function roll(){if(over)return;await play()}
async function play(){
const me=P[turn];
if(me.s>0){me.s--;log(me.n+' skips this turn');msg=me.n+' skips';render();await sleep(700);return end()}
const a=1+rnd(6),b=1+rnd(6);for(let k=0;k<7;k++){dice=dHTML(1+rnd(6),1+rnd(6),1);msg=me.n+' rolls...';render();await sleep(80)}dice=dHTML(a,b,0);msg=me.n+' rolled '+(a+b);render();await sleep(500);
for(let s=0;s<a+b;s++){me.p=(me.p+1)%20;if(me.p===0){me.c+=200;log(me.n+' passed Start: +200')}render();await sleep(110)}
await land(me);end()}
async function land(me){
const i=me.p,t=T[i],bot=me===P[1];
if(t.k==='p'){
const o=own[i];
if(o===undefined){
if(me.c<t.p){log(me.n+' cannot afford '+t.n);msg='Not enough coins';}
else{let buy;
if(bot)buy=me.c>=t.p+250;
else{msg='Buy '+t.n+' for '+t.p+'?';render();buy=await ask([['Buy for '+t.p,()=>true],['Skip',()=>false,1]])}
if(buy){me.c-=t.p;own[i]=P.indexOf(me);log(me.n+' bought '+t.n);msg=me.n+' owns '+t.n}else{log(me.n+' skipped '+t.n);msg='Skipped'}}
}else if(P[o]!==me){const r=Math.min(rent(i),Math.max(me.c,0)+0);const pay=rent(i);me.c-=pay;P[o].c+=pay;log(me.n+' paid '+pay+' rent to '+P[o].n);msg='Rent: '+pay}
else if(!lv[i]){const cost=Math.round(t.p/2);
if(me.c>=cost){let up;
if(bot)up=me.c>=cost+300;
else{msg='Upgrade '+t.n+' for '+cost+'?';render();up=await ask([['Upgrade for '+cost,()=>true],['Not now',()=>false,1]])}
if(up){me.c-=cost;lv[i]=1;log(me.n+' upgraded '+t.n);msg='Upgraded! ★'}}}
}else if(t.k==='e'){const e=EV[rnd(EV.length)];me.c+=e[1];log(me.n+': '+e[0]);msg=e[0]}
else if(t.k==='x'){me.c-=100;log(me.n+' paid tax: -100');msg='Tax: -100'}
else if(t.k==='j'){me.s=1;log(me.n+' lands in Timeout');msg='Timeout: skip next turn'}
else if(t.k==='b'){me.c+=50;log(me.n+' got a bonus: +50');msg='Bonus +50'}
else if(t.k==='r'){msg='Rest stop. Relax.'}
render();await sleep(700)}
async function end(){
const lose=P.findIndex(p=>p.c<0);
if(lose>=0)return fin(P[1-lose].n+' wins! '+P[lose].n+' went bankrupt.');
turn=1-turn;
if(turn===0){round++;if(round>20){const w=P[0].c>=P[1].c?P[0]:P[1];return fin(w.n+' wins with '+w.c+' coins after 20 rounds!')}}
render();
if(turn===1){await sleep(600);await play()}
else{msg='Your turn';render();ask([['Roll dice',roll]])}}
function fin(m){over=true;msg=m;log(m);const r=m.startsWith('You')?400:100;G.coins+=r;save();log('+'+r+' coins for My City');render();ask([['Play again',init],['My City',()=>tab('c'),1]])}
const CITIES=[{n:'Sunport Harbor',m:1,l:['Beacon Tower','Net Loft','Tide Crane','Salt Quay','Pearl Hall']},{n:'Goldleaf Market',m:3,l:['Bell Arcade','Saffron Row','Lantern Hall','Coin Fountain','Weigh House']},{n:'Neon Circuit',m:9,l:['Signal Spire','Gear Works','Sky Tram','Glow Plaza','Core Vault']}];
let G={coins:0,city:0,lv:[0,0,0,0,0]};
try{const s=JSON.parse(localStorage.getItem('cd1'));if(s&&s.lv)G=s}catch(e){}
function save(){try{localStorage.setItem('cd1',JSON.stringify(G))}catch(e){}}
function tab(t){$('mv').hidden=t!=='m';$('cv').hidden=t!=='c';$('tm').className=t==='m'?'':'s';$('tc').className=t==='c'?'':'s';if(t==='c')city()}
function cost(l){return [200,400,800][l]*CITIES[G.city].m}
function city(){const C=CITIES[G.city];const done=G.lv.every(x=>x===3);
let h=`<div class="p"><b>${C.n}</b><span>${G.coins} coins</span></div>`;
C.l.forEach((n,i)=>{const l=G.lv[i];h+=`<div class="lm"><div><b>${n}</b><br><small>${'★'.repeat(l)+'☆'.repeat(3-l)}</small></div>${l<3?`<button ${G.coins<cost(l)?'disabled':''} onclick="up(${i})">Upgrade ${cost(l)}</button>`:'<span>Max</span>'}</div>`});
if(done)h+=G.city<CITIES.length-1?`<button onclick="nxt()">City complete! Unlock ${CITIES[G.city+1].n}</button>`:'<p class="lg">All cities complete. More coming soon!</p>';
else h+='<p class="lg">Win matches to earn coins: win +400, loss +100.</p>';
$('cv').innerHTML=h}
function up(i){const c=cost(G.lv[i]);if(G.coins>=c){G.coins-=c;G.lv[i]++;save();city()}}
function nxt(){G.city++;G.lv=[0,0,0,0,0];save();city()}
if(!G.plots)G.plots=Array(10).fill(null);
let sel=null,first=true;
const COL=['#8b5cf6','#2a9d8f','#e9a23b','#d6577e','#4aa3df','#5b6b8c'];
const BASE=[100,120,150,180,220];
const SKY=[['#ffd9a8','#8fc9f0'],['#ffe7a1','#f5a3b8'],['#2b1a5c','#0b1f4d']];
function bz(t,c,l){const h=30+l*10,g=h/1.5,d=h/1.4;
const s=[`<rect x="20" y="${60-h}" width="20" height="${h}" fill="${c}"/><polygon points="16,${60-h} 44,${60-h} 30,${48-h}" fill="${c}" opacity=".7"/>`,
`<rect x="8" y="${60-g}" width="44" height="${g}" fill="${c}"/><polygon points="4,${60-g} 56,${60-g} 30,${42-g}" fill="${c}" opacity=".7"/>`,
`<rect x="14" y="${60-h}" width="8" height="${h}" fill="${c}"/><rect x="14" y="${60-h}" width="36" height="6" fill="${c}" opacity=".7"/><rect x="46" y="${60-h}" width="3" height="${h/2}" fill="${c}"/>`,
`<rect x="4" y="46" width="52" height="14" fill="${c}"/>`+Array.from({length:l+1},(_,i)=>`<rect x="${10+i*12}" y="${36-i*2}" width="6" height="10" fill="${c}" opacity=".7"/>`).join(''),
`<rect x="12" y="${60-d}" width="36" height="${d}" fill="${c}"/><ellipse cx="30" cy="${60-d}" rx="18" ry="${10+l*2}" fill="${c}" opacity=".7"/>`];
return `<svg viewBox="0 0 60 64" width="100%" height="100%">${s[t]}<rect x="26" y="50" width="8" height="10" fill="#0003"/></svg>`}
function tab(t){first=t==='c';$('mv').hidden=t!=='m';$('cv').hidden=t!=='c';$('tm').className=t==='m'?'':'s';$('tc').className=t==='c'?'':'s';if(t==='c')city()}
function city(){const C=CITIES[G.city],K=SKY[G.city]||SKY[0];
const done=G.plots.every(p=>p&&p.l>=2);
let h=`<div class="p"><b>${C.n}</b><span>${G.coins} coins</span></div>`;
h+=`<div class="sc ${first?'in':''}" style="background:linear-gradient(${K[1]},${K[0]})">${first?`<div class="arr">Arriving at ${C.n}…</div>`:''}<div class="gr">`;
G.plots.forEach((p,i)=>{h+=`<div class="pt ${sel===i?'sel':''}" onclick="pick(${i})">${p?bz(p.t,p.c,p.l):'<small>+</small>'}${p?`<em>${'★'.repeat(p.l)}</em>`:''}</div>`});
h+='</div></div>';first=false;
const p=sel!==null?G.plots[sel]:null;
if(sel===null)h+='<p class="lg">Tap a plot to start building.</p>';
else if(!p)h+=`<p class="lg">Choose a building for plot ${sel+1}:</p><div class="ac">`+C.l.map((n,t)=>`<button class="s" ${G.coins<BASE[t]*C.m?'disabled':''} onclick="bld(${t})">${n} ${BASE[t]*C.m}</button>`).join('')+'</div>';
else{h+=`<p class="lg">${C.l[p.t]}: pick a colour (20 coins) or upgrade.</p><div class="ac">`+COL.map(c=>`<button class="sw" style="background:${c}" onclick="clr('${c}')"></button>`).join('')+'</div>';
h+=p.l<3?`<button ${G.coins<up2()?'disabled':''} onclick="upg()">Upgrade ${up2()}</button>`:'<p class="lg">Max level.</p>'}
if(done)h+=G.city<CITIES.length-1?`<button onclick="nxt()">City complete! Travel to ${CITIES[G.city+1].n}</button>`:'<p class="lg">All cities complete!</p>';
else h+='<p class="lg">Build all 10 plots to level 2 to unlock the next city. Win matches to earn coins.</p>';
$('cv').innerHTML=h}
function pick(i){sel=i;city()}
function bld(t){const c=BASE[t]*CITIES[G.city].m;if(G.coins>=c){G.coins-=c;G.plots[sel]={t,c:COL[0],l:1};save();city()}}
function clr(c){const p=G.plots[sel];if(p&&p.c!==c&&G.coins>=20){G.coins-=20;p.c=c;save();city()}}
function up2(){const p=G.plots[sel];return p?BASE[p.t]*CITIES[G.city].m*p.l:0}
function upg(){const c=up2();if(G.coins>=c){G.coins-=c;G.plots[sel].l++;save();city()}}
function nxt(){G.city++;G.plots=Array(10).fill(null);sel=null;first=true;save();city()}
